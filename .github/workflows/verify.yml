name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install CPU backend and test dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements-dev.txt
      - name: Backend checks
        run: python -B scripts/check_backend.py
      - name: Audit installed API dependency profile
        run: python -B scripts/audit_core.py
      - name: Frontend checks and build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ''
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test:security
          npm audit --omit=dev
          npm run build
      - name: Install browser test tool
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Deterministic browser integration
        env:
          PYTHONPATH: backend
          VITE_DEV_PROXY_TARGET: http://127.0.0.1:8999
        run: |
          python -B backend/tests/integration_server.py > /tmp/rag-api.log 2>&1 &
          api_pid=$!
          (cd frontend && npm run preview -- --host 127.0.0.1 --port 5188 --strictPort) > /tmp/rag-frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$api_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8999/health && curl -fsS http://127.0.0.1:5188/health; then break; fi
            sleep 1
          done
          npm --prefix frontend run test:browser || { cat /tmp/rag-api.log /tmp/rag-frontend.log; exit 1; }
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Validate Compose and both API build contexts
        run: |
          cp backend/.env.example backend/.env
          docker compose --env-file backend/.env config --quiet
          docker build -t research-rag-root .
          docker compose --env-file backend/.env build
      - name: Start the API and validate Nginx
        run: |
          docker compose --env-file backend/.env up -d
          trap 'docker compose --env-file backend/.env logs; docker compose --env-file backend/.env down' EXIT
          docker compose --env-file backend/.env exec -T frontend nginx -t
          curl --retry 15 --retry-connrefused --retry-delay 2 -fsS http://localhost/health
