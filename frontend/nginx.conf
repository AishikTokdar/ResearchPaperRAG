server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 51M;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Preserve the API paths; /api-status is a SPA route, not an API prefix.
    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params_rag;
    }
    location ~ ^/(health|status|upload|ask|models|runtime-summary|pipeline-info|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params_rag;
    }
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
